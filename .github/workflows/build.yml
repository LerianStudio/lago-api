name: Build

# Self-contained Docker build for the fork's release line.
# Publishes ghcr.io/lerianstudio/lago-api:<version> from the repo-root Dockerfile.
#
# This branch is the Lerian release line: upstream tag v1.51.0, plus the
# three-file premium unlock, plus the upstream cherry-pick recorded in
# `.lerian-fork.yml`, and nothing else. It is deliberately NOT `main`.
# `main` tracks upstream untouched, which is the reason this fork exists.
#
# Why the build is inline and not a call to the shared workflow:
# LerianStudio/lago-api is a PUBLIC repository (a GitHub fork of
# getlago/lago-api), and LerianStudio/github-actions-shared-workflows is
# INTERNAL. GitHub does not let a public repository call a reusable workflow
# (or composite action) that lives in an internal or private repository, so
# `uses: LerianStudio/github-actions-shared-workflows/...` fails at parse time
# with "workflow was not found" (run 41095659771, tag 1.51.0-lerian.5). A fork
# cannot be made internal, so this file reproduces, step for step, what the
# shared `build.yml@v1.56.0` did for this caller (GHCR only, single-app,
# cosign on, no Docker Hub, no gitops artifacts, no Helm dispatch).
#
# Revisit when: the shared repository becomes callable from public repos again
# (visibility back to public), or this fork moves to an internal repository.
# Then go back to the thin caller (`uses: ...build.yml@<tag>` with
# enable_dockerhub false, app_name lago-api, secrets inherit). Until then, when
# bumping action pins, take them from the shared workflow so both stay aligned.
#
# Deliberately NOT used: semantic-release, beta/rc channels, gitops auto-bump,
# Helm dispatch, Slack notify. Tags are cut by hand and the AWS gitops repo is
# bumped by PR (the sauron precedent — note rosiehr does the opposite and
# auto-bumps).

on:
  push:
    tags:
      # The `<upstream-semver>-lerian.<n>` fork convention, e.g. 1.51.0-lerian.1:
      # the upstream release this image is built from, plus the revision of the
      # Lerian patch on top of it. Iteration tags append `-rc.<n>`, which build
      # amd64-only (any tag containing the literal `-rc` or `-beta`, as the
      # shared workflow did) — that is exactly what we want while iterating.
      #
      # `+` is not a legal OCI tag character, so no build metadata. No leading
      # `v` is needed: metadata-action normalises a leading `v` away, so
      # `1.51.0-lerian.1` and `v1.51.0-lerian.1` publish the identical
      # `:1.51.0-lerian.1`.
      #
      # Narrower than `v*` on purpose: this cannot fire on an ad-hoc tag like
      # `nightly`, which is not valid semver and would leave metadata-action
      # with an empty tag plan and break the push.
      - '*-lerian.*'

# Least privilege. Every entry is load-bearing:
#   contents: read   -> actions/checkout of the tagged ref
#   packages: write  -> push to ghcr.io/lerianstudio/* if the GITHUB_TOKEN
#                       fallback is used for the GHCR login
#   id-token: write  -> cosign keyless OIDC signing
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/lerianstudio/lago-api

jobs:
  build:
    name: Build lago-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Same rule as the shared workflow: `-beta`/`-rc` tags build amd64 only,
      # every other tag builds amd64+arm64.
      #
      # ⚠ KNOWN COST: a stable `<semver>-lerian.<n>` tag produces linux/amd64
      # AND linux/arm64. The arm64 leg runs under QEMU and compiles this image's
      # native gems, so expect a slow build. Accepted deliberately: the cluster
      # pulls amd64 from the manifest and the cost is CI minutes on a build we
      # cut by hand. Now that the build is inline, dropping arm64 is a one-line
      # change here if it ever stops being worth it.
      - name: Set platforms based on tag type
        id: platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "Building for amd64 only (beta/rc tag)"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "Building for amd64 and arm64 (release tag)"
          fi

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # MANAGE_TOKEN first, as the shared workflow did: that org PAT (org
      # visibility `all`, so it reaches this public repo) created and pushed
      # every ghcr.io/lerianstudio/lago-api tag so far. GITHUB_TOKEN is only the
      # fallback when the secret is absent (a missing secret evaluates to
      # empty), and it can push only if the package grants this repository
      # Write access (Package settings -> Manage Actions access).
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MANAGE_TOKEN || secrets.GITHUB_TOKEN }}

      # The shared workflow stripped a monorepo `<app>-v<semver>` prefix with
      # `sed 's/.*-\(v[0-9]\)/\1/'`. A fork tag has no such prefix, so the sed
      # was the identity: the version is the git tag itself, and the image tag
      # is that version without a leading `v`.
      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${TAG}"

      # Registry tags are immutable: abort before building rather than
      # overwrite an image that is already published (the shared workflow's
      # default `on_existing_tag: fail`). A failed lookup counts as "absent",
      # so a flaky check never blocks a legitimate build.
      - name: Pre-flight tag existence check
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          REF="${IMAGE}:${IMAGE_TAG}"
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "::error::Tag ${IMAGE_TAG} already exists (${REF}). Registry tags are immutable; aborting before rebuild."
            exit 1
          fi
          echo "Tag ${IMAGE_TAG} not present in GHCR — proceeding with build."

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}

      # metadata-action yields an empty tag list for a tag that is not valid
      # semver; fail with a clear message instead of a confusing push error,
      # and make sure the published tag is exactly the git tag.
      - name: Verify image tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED: ${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
        run: |
          if [ "$TAGS" != "$EXPECTED" ]; then
            echo "::error::Unexpected image tags '${TAGS}', expected exactly '${EXPECTED}'. Is the git tag valid semver?"
            exit 1
          fi
          echo "Publishing ${EXPECTED}"

      # docker_build_args stay unset, as in the thin caller: the v1.51.0
      # Dockerfile still declares SEGMENT_WRITE_KEY, GOCARDLESS_CLIENT_ID and
      # GOCARDLESS_CLIENT_SECRET as build args that upstream CI bakes into the
      # public image as ENV. A Lerian build has none of those credentials and
      # should not: verified against the live installation that no payment
      # provider of any kind is configured, and that the GoCardless OAuth
      # connect flow — the only consumer of those two vars — is already
      # inoperable there because LAGO_OAUTH_PROXY_URL is unset.
      #
      # The shared workflow also passed a `github_token` BuildKit secret; this
      # Dockerfile never mounts it, so it is not passed here.
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pinned by digest like the action SHAs above, and bumped together
          # with them; `:latest` stays only so the reference reads as a name.
          sbom: generator=docker/scout-sbom-indexer:latest@sha256:cdf69767d010bd4e8d33001fbb629cdc5210e37a67cdecc800bdcacf3bc996b0
          provenance: mode=max
          # Registry cache, not `type=gha`: GitHub restores Actions cache entries
          # only from the current ref or the default branch. This workflow runs
          # only on tag pushes, each tag is a new ref, and the default branch
          # (`main`, the upstream mirror) never runs it, so a gha cache would
          # never hit. This adds a `buildcache` tag to the same GHCR package;
          # the pre-flight check and the image tag guard look only at the
          # release tag, so they ignore it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ----------------- Cosign Image Signing -----------------
      # Mirrors the shared cosign-sign composite: same installer pin and cosign
      # version, keyless OIDC signing of the pushed digest, retried with
      # exponential backoff (×3, capped, equal jitter). The install is retried
      # once too: the image is already pushed and immutable at this point, so a
      # transient download failure must not leave the tag unsigned.
      - name: Install cosign
        id: cosign-install
        continue-on-error: true
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v2.5.0

      - name: Wait before retrying the cosign install
        if: steps.cosign-install.outcome == 'failure'
        run: |
          echo "::warning::Installing cosign failed — most likely transient egress toward the GitHub release assets. Retrying once in 15s."
          sleep 15

      - name: Install cosign (retry)
        if: steps.cosign-install.outcome == 'failure'
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v2.5.0

      - name: Sign container image with cosign
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          MAX_ATTEMPTS: '5'
          INITIAL_DELAY: '5'
          MAX_DELAY: '60'
        run: |
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::build-push-action returned no digest ('${DIGEST}'); nothing to sign."
            exit 1
          fi
          REF="${IMAGE}@${DIGEST}"
          cosign version

          delay="$INITIAL_DELAY"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Signing (attempt $attempt/$MAX_ATTEMPTS): $REF"
            if cosign sign --yes "$REF"; then
              echo "::notice::Signed $REF"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              capped="$delay"
              [ "$capped" -gt "$MAX_DELAY" ] && capped="$MAX_DELAY"
              half=$((capped / 2))
              sleep_time=$((half + RANDOM % (half + 1)))
              echo "::warning::cosign sign failed (attempt $attempt/$MAX_ATTEMPTS) — retrying in ${sleep_time}s…"
              sleep "$sleep_time"
              delay=$((delay * 3))
            fi
          done

          echo "::error::cosign sign failed after $MAX_ATTEMPTS attempts: $REF. The image is pushed but unsigned; sign it manually with 'cosign sign --yes $REF'."
          exit 1
