upstream:
  repo: https://github.com/getlago/lago-api
  tag: v1.51.0
  sha: 71680d30cf695c86c59510dbb201a12307fe31be
lerian:
  branch: lerian/1.51.0
  version: 1.51.0-lerian.4
  image: ghcr.io/lerianstudio/lago-api:1.51.0-lerian.4
patches:
  - name: premium-unlock
    files:
      - app/models/organization.rb
      - app/serializers/admin/organization_serializer.rb
      - lib/lago_utils/lago_utils/license.rb
  - name: upstream-cherry-pick
    commit: b0f75059bde0736bfec4c5fae75cba2bfe279b4d
    upstream_pr: 6087
    reason: >-
      display zero-unit flat fees in the invoice PDF. Without it v1.51.0 charges
      the flat fee but Fee.positive_units drops the line, so the invoice total
      does not match the visible lines. Not in any upstream release as of
      2026-08-21 (v1.51.0-55-gb0f75059b).
    drop_when: upstream cuts a release containing this commit
  - name: upstream-cherry-pick
    commit: 0447828b740d70a4417f9e15fae04e42f07f6f3e
    upstream_pr: 6489
    reason: >-
      page footer rendered by Gotenberg on every page (a separate Slim
      template posted as the footer.html part, with a localized page counter
      in a new document.page_numbering key). It is the mechanism the Lerian
      brand footer needs: as an in-flow element at the end of the body it
      landed alone on a new page whenever the content ended near the page
      bottom, and multi-subscription invoices carried it on page 1 only. The
      lerian-invoice-branding patch brands the footer template it adds and
      raises its bottom margin from 0.6 to 0.66in for the two-line footer.
    drop_when: upstream upgrade to >= v1.54.0
  - name: fix-backfill-organization-slugs-column-cache
    files:
      - db/migrate/20260416111923_backfill_organization_slugs.rb
    upstream_issue: >-
      none. No upstream issue, PR or commit exists: `git log --all` on this
      migration file returns the single commit that created it (8c8515605).
      Found by the Lerian upgrade rehearsal on 2026-08-21, not reported
      upstream.
    reason: >-
      a single-process `db:migrate` over the 249 migrations pending between
      v1.33.4 and v1.51.0 dies here with
      `ActiveModel::MissingAttributeError: can't write unknown attribute
      'slug'`. Chain: 20260202155431 runs Organization.find_each, which
      populates the per-process Organization column cache; 20260416111922 then
      adds the `slug` column; this migration calls
      `org.update_column(:slug, …)` against the stale cache and raises. Adding
      `Organization.reset_column_information` as the first statement of `up`
      is the canonical Rails fix. Upstream CI never reaches this state because
      it loads db/structure.sql instead of running the chain in sequence, so
      only self-hosted upgrades are affected.
    schema_impact: >-
      none. reset_column_information only drops an in-process column-metadata
      memo; it emits no DDL and no DML. The final schema and the final
      schema_migrations set are byte-identical with and without this patch.
      NOTE: this is the one patch that edits a file under db/migrate/, which
      is otherwise an invariant of this fork.
    drop_when: upstream adds reset_column_information to this migration
  - name: data-api-guard-when-unconfigured
    files:
      - app/services/data_api/base_service.rb
      - app/services/data_api/usages_service.rb
      - app/services/data_api/mrrs/plans_service.rb
      - app/services/data_api/revenue_streams/plans_service.rb
      - app/services/data_api/revenue_streams/customers_service.rb
      - spec/spec_helper.rb
      - spec/services/data_api/base_service_spec.rb
    upstream_issue: >-
      none. Searched getlago/lago-api for LAGO_DATA_API_URL and for
      URI::InvalidComponentError: zero issues or pull requests. Found in Lerian
      production on 2026-08-22, not reported upstream.
    reason: >-
      the Lago Data API is a separate component (getlago/data-api, a private
      Docker Hub image) that is not deployed in any Lerian environment, so
      LAGO_DATA_API_URL is unset. Upstream neither defaults nor validates it:
      app/services/data_api/base_service.rb interpolated the blank value into a
      host-less URL, LagoHttpClient::Client passed it to URI(), and the New
      Relic net/http wrapper rebuilt it as "http://:80/..." and raised
      URI::InvalidComponentError. Result: HTTP 500 on five GraphQL operations
      (getRevenueStreams, getRevenueStreamsPlanBreakdown, getMrrs,
      getMrrPlanBreakdown, getForecasts) and on the public REST route
      GET /api/v1/analytics/usage, which has no premium gate at all. The guard
      short-circuits to an empty but SUCCESSFUL payload when the variable is
      blank. It must be successful, not a failure: the ten Data API resolvers
      read result.<attribute> directly, never call raise_if_error!, and declare
      their field null: false, so a failed result yields nil and raises
      GraphQL::InvalidNullError - another 500. Raising is equally unusable, as
      no rescue_from exists at schema or resolver level.
    behaviour_when_configured: >-
      unchanged. The guard fires only when LAGO_DATA_API_URL is nil or blank;
      with a value present the HTTP path is identical to upstream.
    drop_when: >-
      the Data API is deployed and LAGO_DATA_API_URL is configured, or upstream
      starts validating the variable itself
  - name: lerian-invoice-branding
    files:
      - app/views/helpers/money_helper.rb
      - spec/views/helpers/money_helper_spec.rb
      - app/views/templates/invoices/v4.slim
      - app/views/templates/invoices/v4/charge.slim
      - app/views/templates/invoices/v4/fixed_charge.slim
      - app/views/templates/invoices/v4/one_off.slim
      - app/views/templates/invoices/v4/self_billed.slim
      - app/views/templates/invoices/v4/_charge.slim
      - app/views/templates/invoices/v4/_charge_percentage.slim
      - app/views/templates/invoices/v4/_conversion_row.slim
      - app/views/templates/invoices/v4/_credit.slim
      - app/views/templates/invoices/v4/_default_fee.slim
      - app/views/templates/invoices/v4/_default_fee_with_filters.slim
      - app/views/templates/invoices/v4/_fixed_charge.slim
      - app/views/templates/invoices/v4/_graduated.slim
      - app/views/templates/invoices/v4/_graduated_percentage.slim
      - app/views/templates/invoices/v4/_one_off.slim
      - app/views/templates/invoices/v4/_package.slim
      - app/views/templates/invoices/v4/_percentage.slim
      - app/views/templates/invoices/v4/_prepaid_credits.slim
      - app/views/templates/invoices/v4/_progressive_billing_details.slim
      - app/views/templates/invoices/v4/_subscription_details.slim
      - app/views/templates/invoices/v4/_subscriptions_summary.slim
      - app/views/templates/invoices/v4/_true_up_fee.slim
      - app/views/templates/invoices/v4/_volume.slim
      - app/views/templates/documents/footer.slim
      - app/services/utils/pdf_generator.rb
      - spec/services/utils/pdf_generator_spec.rb
      - spec/views/app/views/templates/documents/footer.slim_spec.rb
      - lerian/invoice-branding/
      - spec/views/app/views/templates/invoices/__snapshots__/templates_invoices_v4.slim/
      - spec/views/app/views/templates/invoices/v4/__snapshots__/
    reason: >-
      branding of the customer-facing invoice PDFs issued to Lerian Clients.
      Upstream Lago OSS has no per-organization template customisation, so the
      v4 invoice template itself is patched: embedded Inter and IBM Plex Mono,
      a header card with the Lerian wordmark (the billing entity logo still
      wins), status/issuing/due-date chips, aligned money cells via
      MoneyHelper.cell, a payment detail block instead of the powered-by logo,
      in v4.slim and in the standalone one_off, charge, fixed_charge and
      self_billed roots, and a brand page footer (documents/footer.slim, the
      Gotenberg footer.html part from the upstream #6489 cherry-pick) with the
      wordmark, legal name, document reference and page counter on every page
      of invoices, credit notes and payment receipts; its bottom margin in
      Utils::PdfGenerator is 0.66in instead of upstream's 0.6. MoneyHelper.cell is the one Ruby
      addition, a presentational helper in app/views/helpers/money_helper.rb;
      no data logic changes. lerian.4 tightened the vertical spacing (header
      card, chips, block margins, billing-period gap, amount panel, table head
      cells, totals rows, footer) so
      the two-period usage shape keeps its payment block on page 1, and moved
      the brand footer from the body to the page footer.
    regenerate: >-
      python3 lerian/invoice-branding/build_template.py. It reads the pristine
      templates with `git show <upstream.sha>` (the page footer from the #6489
      commit) and overwrites v4.slim, v4/ and documents/footer.slim in place;
      never hand-edit the generated files. MoneyHelper.cell and its
      spec are hand-maintained, not generated.
    drop_when: >-
      never while Lerian invoices need branding. On every upstream bump,
      re-run the generator against the new upstream.sha, update the invoice
      view spec snapshots after reading their diff, and re-validate a real
      PDF render.
